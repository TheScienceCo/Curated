name: job-intelligence-agent

services:
  db:
    # pgvector/pgvector ships Postgres with the vector extension preinstalled,
    # so enabling semantic retrieval later is a migration rather than a rebuild.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jia_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-jia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jia} -d ${POSTGRES_DB:-jia}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      # Root context: the backend image needs data/ for the demo dataset.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jia}:${POSTGRES_PASSWORD:-jia_local_password}@db:5432/${POSTGRES_DB:-jia}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      # Defaults to the deterministic pipeline; set these to enable the LLM.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      # Server components reach the API over the compose network instead.
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
